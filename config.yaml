listen: ":20127"

upstreams:
  - path_prefix: "/v1"
    base_url: "http://localhost:20128/v1"

fallback_ruleset: default

rulesets:
  - name: default
    rules:
      - model: "*"
        limit: 10
        window_secs: 3600
        time_start: "00:00"
        time_end: "23:59"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]

  - name: premium
    rules:
      - model: "*"
        limit: 500
        window_secs: 3600
        time_start: "07:00"
        time_end: "22:00"
        days: [Mon, Tue, Wed, Thu, Fri]

api_keys:
  - ruleset: premium
    keys:
      - "sk-abc-123"
      - "sk-def-456"
