listen: ":8080"

upstreams:
  - path_prefix: "/v1/chat/completions"
    base_url: "https://api.openai.com"
  - path_prefix: "/v1/messages"
    base_url: "https://api.anthropic.com"

fallback_ruleset: default

rulesets:
  - name: default
    rules:
      - model: "*"
        limit: 10
        window_secs: 3600
        time_start: "00:00"
        time_end: "23:59"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]

  - name: premium
    rules:
      - model: "*"
        limit: 500
        window_secs: 3600
        time_start: "07:00"
        time_end: "22:00"
        days: [Mon, Tue, Wed, Thu, Fri]

api_keys:
  - ruleset: premium
    keys:
      - "sk-abc-123"
      - "sk-def-456"
