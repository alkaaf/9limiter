<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9limiter &mdash; Dashboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f0f1a;color:#e0e0e0;height:100vh;display:flex;flex-direction:column}
  header{background:#1a1a2e;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a4a}
  header h1{font-size:18px;font-weight:600}
  .live-indicator{display:flex;align-items:center;gap:8px;font-size:13px;color:#666}
  .live-indicator .dot{width:8px;height:8px;border-radius:50%;background:#4caf50}
  .live-indicator .dot.disconnected{background:#f44336}
  .dashboard{display:flex;flex:1;overflow:hidden}
  .panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .panel-left{border-right:1px solid #2a2a4a}
  .panel h2{font-size:13px;text-transform:uppercase;color:#888;padding:12px 16px;border-bottom:1px solid #2a2a4a;letter-spacing:.5px}
  .scroll{flex:1;overflow-y:auto;padding:12px}
  .key-card{background:#1a1a2e;border-radius:8px;padding:14px;margin-bottom:10px;border:1px solid #2a2a4a}
  .key-card .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .key-card .api-key{font-family:monospace;font-size:13px}
  .key-card .meta{font-size:11px;color:#888;margin-bottom:8px}
  .bar-track{height:8px;background:#2a2a4a;border-radius:4px;overflow:hidden;margin-bottom:4px}
  .bar-fill{height:100%;border-radius:4px;transition:width .3s,background .3s}
  .bar-fill.green{background:#4caf50}
  .bar-fill.orange{background:#ff9800}
  .bar-fill.red{background:#f44336}
  .stats{display:flex;justify-content:space-between;font-size:12px}
  .stats .count{font-family:monospace;font-weight:600}
  .stats .remaining{color:#888}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;padding:6px 8px;color:#888;font-weight:500;border-bottom:1px solid #2a2a4a;position:sticky;top:0;background:#0f0f1a}
  td{padding:6px 8px;border-bottom:1px solid #1a1a2e;font-family:monospace;font-size:11px}
  tr.in-flight{opacity:.5}
  .status-200{color:#4caf50}
  .status-429{color:#f44336}
  .status-err{color:#ff9800}
  td .key-trunc{max-width:80px;overflow:hidden;text-overflow:ellipsis;display:inline-block;white-space:nowrap;vertical-align:middle}
  .rate-info{font-size:12px;color:#888;display:flex;gap:16px;padding:8px 16px;border-bottom:1px solid #2a2a4a}
  .log-bar{background:#0a0a14;border-top:1px solid #2a2a4a;height:160px;display:flex;flex-direction:column}
  .log-bar h2{font-size:11px;text-transform:uppercase;color:#666;padding:4px 12px;letter-spacing:.5px;border-bottom:1px solid #1a1a2a}
  .log-scroll{flex:1;overflow-y:auto;padding:2px 12px;font-family:monospace;font-size:11px}
  .log-line{color:#888;padding:1px 0;white-space:pre;line-height:1.5}
  .log-line .ts{color:#555}
  .log-line .lvl-info{color:#4caf50}
  .log-line .lvl-warn{color:#ff9800}
  .log-line .lvl-error{color:#f44336}
  @media(max-width:768px){.dashboard{flex-direction:column}}
</style>
</head>
<body>
<header>
  <h1>9limiter</h1>
  <div style="font-size:13px;color:#888;font-family:monospace" id="clock"></div>
  <div class="live-indicator">
    <span class="dot" id="dot"></span>
    <span id="status-text">connecting&hellip;</span>
  </div>
</header>
<div class="rate-info">
  <span id="keys-count">0 keys</span>
  <span id="reqs-count">0 requests</span>
</div>
<div class="dashboard">
  <div class="panel panel-left">
    <h2>Rate Limit Status</h2>
    <div class="scroll" id="rate-cards"></div>
  </div>
  <div class="panel panel-right">
    <h2>Live Requests</h2>
    <div class="scroll" id="log-table">
      <table><thead><tr>
        <th>Time</th><th>Key</th><th>Owner</th><th>Model</th><th>Status</th><th>Latency</th>
      </tr></thead><tbody id="log-body"></tbody></table>
    </div>
  </div>
</div>
<div class="log-bar">
  <h2>Logs</h2>
  <div class="log-scroll" id="log-output"></div>
</div>
<script>
const MAX_LOG=200;let logCount=0, syncInt=null, clockInt=null, serverTime=null;
function shortKey(k){return k.length>12?k.slice(0,12)+'…':k}
function tickClock(){
  if(serverTime){
    serverTime.setSeconds(serverTime.getSeconds()+1);
    document.getElementById('clock').textContent=serverTime.toLocaleString('id-ID',{hour12:false,timeZone:'UTC'});
  } else {
    document.getElementById('clock').textContent='--:--:--';
  }
}
clockInt=setInterval(tickClock,1000);
function connect(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(proto+'//'+location.host+'/_ws');
  const dot=document.getElementById('dot');
  const st=document.getElementById('status-text');
  ws.onopen=()=>{dot.className='dot';st.textContent='connected';
    if(syncInt)clearInterval(syncInt);
    syncInt=setInterval(()=>{ws.send('{"cmd":"sync"}');ws.send('{"cmd":"clock"}')},5000);
  };
  ws.onclose=()=>{if(syncInt)clearInterval(syncInt);dot.className='dot disconnected';st.textContent='disconnected';setTimeout(connect,2000)};
  ws.onerror=()=>ws.close();
  ws.onmessage=msg=>{
    try{const e=JSON.parse(msg.data);
      if(e.type==='clock'){const p=e.time.split(':');const d=new Date();d.setUTCHours(+p[0],+p[1],+p[2],0);serverTime=d;tickClock()}
      else if(e.type==='rate_limit')renderCard(e.data??e);
      else if(e.type==='request')renderRow(e);
      else if(e.type==='request_end')updateRow(e);
      else if(e.type==='log')renderLog(e)
    }catch(_){}
  }
}
function renderCard(d){
  const c=document.getElementById('rate-cards');
  const id='card-'+btoa(d.api_key+d.model+d.rule_limit);
  let card=document.getElementById(id);
  if(!card){
    card=document.createElement('div');card.id=id;card.className='key-card';
    card.innerHTML='<div class="header"><span class="api-key">'+shortKey(d.api_key)+'</span>'+(d.owner?' <span style="color:#888;font-size:12px">'+d.owner+'</span>':'')+'</div><div class="meta">Model: '+d.model+' &middot; window '+d.rule_window_secs+'s</div><div class="bar-track"><div class="bar-fill"></div></div><div class="stats"><span class="count">0 / '+d.rule_limit+'</span><span class="remaining">0 remaining</span></div>';
    c.prepend(card);
  }
  const pct=d.count/d.rule_limit;
  const bar=card.querySelector('.bar-fill');
  bar.style.width=Math.min(pct*100,100)+'%';
  bar.className='bar-fill '+(pct<.7?'green':pct<.9?'orange':'red');
  card.querySelector('.count').textContent=d.count+' / '+d.rule_limit;
  card.querySelector('.remaining').textContent=d.remaining+' remaining';
}
function renderRow(d){
  const t=document.getElementById('log-body');
  const r=document.createElement('tr');r.id='log-'+d.id;r.className='in-flight';
  r.innerHTML='<td>'+new Date().toLocaleTimeString()+'</td><td title="'+d.api_key+'">'+shortKey(d.api_key)+'</td><td>'+(d.owner||'')+'</td><td>'+d.model+'</td><td><span class="status-err">&hellip;</span></td><td>&mdash;</td>';
  t.prepend(r);logCount++;
  while(t.children.length>MAX_LOG)t.removeChild(t.lastChild);
  document.getElementById('reqs-count').textContent=Math.min(logCount,MAX_LOG)+' requests';
}
function updateRow(d){
  const r=document.getElementById('log-'+d.id);if(!r)return;
  r.className='';
  const sc=d.status===200?'status-200':d.status===429?'status-429':'status-err';
  r.querySelector('td:nth-child(5)').innerHTML='<span class="'+sc+'">'+d.status+'</span>';
  r.querySelector('td:nth-child(6)').textContent=d.latency_ms?(d.latency_ms/1000).toFixed(1)+'s':'&mdash;'
}
function renderLog(d){
  const el=document.getElementById('log-output');
  const line=document.createElement('div');line.className='log-line';
  const lvl='lvl-'+d.level;
  line.innerHTML='<span class="ts">'+d.time+'</span> <span class="'+lvl+'">'+d.level.toUpperCase()+'</span> '+d.msg;
  el.appendChild(line);
  el.scrollTop=el.scrollHeight;
  while(el.children.length>500)el.removeChild(el.firstChild);
}
connect();
</script>
</body>
</html>
